<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>QuotaPie</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0b0d11;
        --card: #151820;
        --line: #282d38;
        --text: #f2f4f8;
        --muted: #8f98a8;
        --good: #54d39a;
        --warm: #f0bd5e;
        --hot: #f07474;
        --codex: #55d6be;
        --claude: #d9966b;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: radial-gradient(circle at 15% -10%, #22303a 0, transparent 34%), var(--bg);
        color: var(--text);
        font: 14px/1.45 ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      main { width: min(1100px, calc(100% - 32px)); margin: 38px auto 80px; }
      header { display: flex; justify-content: space-between; align-items: end; margin-bottom: 22px; }
      h1 { margin: 0; font-size: clamp(27px, 5vw, 44px); letter-spacing: -0.04em; }
      .subtitle, .muted { color: var(--muted); }
      .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(330px, 1fr)); gap: 16px; }
      .provider {
        background: color-mix(in srgb, var(--card) 94%, transparent);
        border: 1px solid var(--line);
        border-radius: 18px;
        padding: 20px;
        box-shadow: 0 18px 50px rgb(0 0 0 / 20%);
      }
      .provider h2 { margin: 0 0 16px; text-transform: capitalize; font-size: 20px; }
      .window { padding: 15px 0; border-top: 1px solid var(--line); }
      .window:first-of-type { border-top: 0; padding-top: 0; }
      .row { display: flex; justify-content: space-between; gap: 16px; align-items: baseline; }
      .label { font-weight: 700; }
      .remaining { font-size: 24px; font-weight: 800; letter-spacing: -0.03em; }
      .bar { height: 7px; border-radius: 99px; background: #262b34; overflow: hidden; margin: 9px 0 10px; }
      .fill { height: 100%; border-radius: inherit; background: var(--good); transition: width .35s ease; }
      .hot .fill { background: var(--hot); }
      .warm .fill { background: var(--warm); }
      .unknown .fill { background: #4c5361; }
      .facts { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 12px; color: var(--muted); font-size: 12px; }
      .fact strong { color: var(--text); font-weight: 600; }
      .badge { padding: 3px 8px; border-radius: 99px; font-size: 11px; background: #242936; color: var(--muted); }
      .bottleneck { color: var(--warm); }
      section.events { margin-top: 26px; }
      .event { display: grid; grid-template-columns: 145px 90px 1fr; gap: 12px; padding: 11px 0; border-top: 1px solid var(--line); }
      .event .kind { color: var(--warm); }
      .empty { padding: 48px 24px; text-align: center; color: var(--muted); border: 1px dashed var(--line); border-radius: 18px; }
      .notice { color: #c2410c; font-size: 13px; margin: 4px 0 10px; }
      @media (max-width: 620px) {
        header { display: block; }
        .grid { grid-template-columns: 1fr; }
        .event { grid-template-columns: 1fr; gap: 2px; }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <div>
          <h1>QuotaPie</h1>
          <div class="subtitle" id="subtitle"></div>
        </div>
        <div id="updated" class="muted"></div>
      </header>
      <div id="providers" class="grid"></div>
      <section class="events">
        <h2 id="whyChanged"></h2>
        <div id="events" class="muted"></div>
      </section>
    </main>
    <script>
      const escapeHtml = (value) => String(value ?? "")
        .replaceAll("&", "&amp;").replaceAll("<", "&lt;").replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;").replaceAll("'", "&#039;");
      const duration = (ms) => {
        if (ms == null) return t("time.unknown");
        const minutes = Math.max(0, Math.round(ms / 60000));
        const days = Math.floor(minutes / 1440);
        const hours = Math.floor((minutes % 1440) / 60);
        const rest = minutes % 60;
        return days ? `${days}${t("time.days")} ${hours}${t("time.hours")}` : hours ? `${hours}${t("time.hours")} ${rest}${t("time.minutes")}` : `${rest}${t("time.minutes")}`;
      };
      const number = (value, suffix = "") => value == null ? "—" : `${Number(value).toFixed(1)}${suffix}`;
      const exactTime = (ms) => ms == null ? "—" : new Date(ms).toLocaleString([], { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" });
      // This page renders in the browser's language, not the daemon's. The keys
      // mirror src/i18n.ts so the same concept is named the same on both sides.
      const LOCALE = (navigator.language || "en").toLowerCase().startsWith("ko") ? "ko" : "en";
      const STRINGS = {
        en: {
          "collection.auth-required": "Sign-in required",
          "collection.auth-expired": "Sign-in expired",
          "collection.rate-limited": "Provider rate limit reached",
          "collection.network": "Cannot reach the network",
          "collection.not-configured": "Collection is not configured",
          "collection.isolation-unsafe": "Account credentials need isolating",
          "collection.provider-error": "Could not read the provider's response",
          "collection.no-windows": "The response carried no limit windows",
          "collection.never-attempted": "Not collected yet",
          "collection.stale-success": "Collection is running late",
          "collection.attempted-then-failed": "Collection failed",
          "window.used": "% used",
          "window.remaining": "% left",
          "window.noWindows": "No limit windows to show.",
          "window.resetUnknown": "Reset time unknown",
          "window.resetsIn": " until reset",
          "freshness.fresh": "current",
          "freshness.stale": "stale",
          "freshness.reset_due": "confirming reset",
          "freshness.unknown": "unknown",
          "empty": "Run `quotapie poll`, then connect the Claude status line.",
          "updated": " refreshed",
          "noEvents": "No events recorded yet.",
          "failed": "Connection failed",
          "page.subtitle": "Provider clock + personal burn rate",
          "page.connecting": "Connecting…",
          "page.waiting": "Waiting for the first observation.",
          "page.whyChanged": "Why it changed",
          "time.unknown": "unknown",
          "time.days": "d",
          "time.hours": "h",
          "time.minutes": "m",
          "fact.recent": "Recent pace",
          "fact.personal": "Personal baseline",
          "fact.vsSafe": "Vs safe pace",
          "fact.confidence": "Forecast confidence",
          "fact.activeHours": "Active hours left",
          "fact.samples": "Learning samples",
          "fact.providerReset": "Provider reset",
          "fact.safetyEta": "Safety margin ETA",
          "fact.observed": "Source observation",
          "fact.observedAge": "Observed",
          "unit.perActiveHour": "%/active h",
          "unit.times": "×",
          "unit.hours": "h",
          "fact.source": "Data source",
          "fact.provenance": "Provenance",
          "detail.used": "used",
          "detail.reset": "reset",
          "detail.shift": "shift",
          "detail.credits": "credits",
          "detail.confidence": "confidence",
          "unit.min": "min",
          "event.first_observation": "First observation",
          "event.scheduled_reset": "Scheduled reset",
          "event.external_relief": "Early refill",
          "event.allowance_relief": "Possible allowance change",
          "event.schedule_rebased": "Reset clock rebased",
          "event.meter_correction": "Meter correction",
          "event.source_unknown": "Source value missing",
          "event.source_changed": "Data source changed",
          "event.paid_usage": "Paid credits used",
          "event.credit_topup": "Credit balance increased",
          "event.banked_reset_consumed": "Banked reset used",
          "event.bucket_retired": "Tracking stopped",
          "event.out_of_order": "Out-of-order response ignored",
          "event.window_changed": "Limit window changed",
        },
        ko: {
          "collection.auth-required": "로그인이 필요합니다",
          "collection.auth-expired": "로그인이 만료됐습니다",
          "collection.rate-limited": "공급자 요청 한도에 걸렸습니다",
          "collection.network": "네트워크에 연결할 수 없습니다",
          "collection.not-configured": "수집이 설정되지 않았습니다",
          "collection.isolation-unsafe": "계정 자격증명 격리가 필요합니다",
          "collection.provider-error": "공급자 응답을 읽지 못했습니다",
          "collection.no-windows": "응답에 한도 창이 없습니다",
          "collection.never-attempted": "아직 수집을 시도하지 않았습니다",
          "collection.stale-success": "한도 확인이 지연되고 있습니다",
          "collection.attempted-then-failed": "수집에 실패했습니다",
          "window.used": "% 사용",
          "window.remaining": "% 남음",
          "window.noWindows": "표시할 한도 창이 없습니다.",
          "window.resetUnknown": t("window.resetUnknown"),
          "window.resetsIn": " 뒤 리셋",
          "freshness.fresh": "정상",
          "freshness.stale": "오래됨",
          "freshness.reset_due": "갱신 확인 중",
          "freshness.unknown": "알 수 없음",
          "empty": "`quotapie poll` 실행 후 Claude status-line을 연결해 주세요.",
          "updated": " 화면 갱신",
          "noEvents": "아직 기록된 이벤트가 없습니다.",
          "failed": "연결 실패",
          "page.subtitle": "공급자 원본 시계 + 개인 사용 속도",
          "page.connecting": "연결 중…",
          "page.waiting": "첫 관측을 기다리는 중입니다.",
          "page.whyChanged": "왜 바뀌었나",
          "time.unknown": "알 수 없음",
          "time.days": "일",
          "time.hours": "시간",
          "time.minutes": "분",
          "fact.recent": "현재 속도",
          "fact.personal": "개인 기준",
          "fact.vsSafe": "안전 속도 대비",
          "fact.confidence": "예측 신뢰도",
          "fact.activeHours": "활동 가능 시간",
          "fact.samples": "학습 표본",
          "fact.providerReset": "공급자 리셋",
          "fact.safetyEta": "안전 여유 ETA",
          "fact.observed": "원본 관측",
          "fact.observedAge": "관측 경과",
          "unit.perActiveHour": t("unit.perActiveHour"),
          "unit.times": "×",
          "unit.hours": "h",
          "fact.source": "데이터 출처",
          "fact.provenance": "원본성",
          "detail.used": "사용",
          "detail.reset": "리셋",
          "detail.shift": "시각",
          "detail.credits": "크레딧",
          "detail.confidence": "신뢰도",
          "unit.min": "분",
          "event.first_observation": "첫 관측",
          "event.scheduled_reset": "정상 리셋",
          "event.external_relief": "예정 밖 충전",
          "event.allowance_relief": "한도 완화 가능성",
          "event.schedule_rebased": "리셋 시각 조정",
          "event.meter_correction": "사용률 보정",
          "event.source_unknown": "원본 누락",
          "event.source_changed": "데이터 소스 변경",
          "event.paid_usage": "유료 크레딧 사용",
          "event.credit_topup": "크레딧 증가",
          "event.banked_reset_consumed": "저장형 리셋 사용",
          "event.bucket_retired": "항목 추적 종료",
          "event.out_of_order": "오래된 응답 무시",
          "event.window_changed": "한도 창 전환",
        },
      };
      const t = (key) => (STRINGS[LOCALE] ?? STRINGS.en)[key] ?? STRINGS.en[key] ?? key;

      const collectionText = (collection) =>
        t(`collection.${collection.errorCategory ?? collection.health}`);

      const statusName = new Proxy({}, { get: (_target, key) => t(`freshness.${String(key)}`) });
      const windowHtml = (window, bottleneck) => {
        const remaining = window.remainingPercent;
        // The fill is the used percentage, exactly as the native app draws it.
        // The two surfaces drawing opposite bars for the same window was a
        // plain lie about which one was nearly full.
        const used = window.usedPercent ?? (remaining == null ? null : 100 - remaining);
        const heat = window.freshness !== "fresh" || remaining == null
          ? "unknown"
          : remaining <= window.reservePercent ? "hot" : window.paceRatio > 1 ? "warm" : "";
        return `<div class="window ${heat}">
          <div class="row"><span class="label ${bottleneck ? "bottleneck" : ""}">${bottleneck ? "● " : ""}${escapeHtml(window.label)}</span><span class="badge">${escapeHtml(statusName[window.freshness] ?? window.freshness)}</span></div>
          <div class="row"><span class="remaining">${used == null ? "—" : `${used.toFixed(1)}${t("window.used")}`}</span><span class="muted">${remaining == null ? "" : `${remaining.toFixed(1)}${t("window.remaining")}`}</span><span class="muted">${window.resetsAtMs == null ? t("window.resetUnknown") : `${duration(window.timeToResetMs)}${t("window.resetsIn")}`}</span></div>
          <div class="bar"><div class="fill" style="width:${used == null ? 0 : Math.max(0, Math.min(100, used))}%"></div></div>
          <div class="facts">
            <div class="fact">${t("fact.recent")} <strong>${number(window.recentBurnPerHour, t("unit.perActiveHour"))}</strong></div>
            <div class="fact">${t("fact.personal")} <strong>${number(window.personalBurnPerHour, t("unit.perActiveHour"))}</strong></div>
            <div class="fact">${t("fact.vsSafe")} <strong>${number(window.paceRatio, "×")}</strong></div>
            <div class="fact">${t("fact.confidence")} <strong>${escapeHtml(window.confidence)}</strong></div>
            <div class="fact">${t("fact.activeHours")} <strong>${number(window.activeHoursUntilReset, "h")}</strong></div>
            <div class="fact">${t("fact.samples")} <strong>${window.sampleCount}</strong></div>
            <div class="fact">${t("fact.providerReset")} <strong>${exactTime(window.resetsAtMs)}</strong></div>
            <div class="fact">${t("fact.safetyEta")} <strong>${exactTime(window.exhaustsAtMs)}</strong></div>
            <div class="fact">${t("fact.observed")} <strong>${exactTime(window.observedAtMs)}</strong></div>
            <div class="fact">${t("fact.observedAge")} <strong>${duration(Date.now() - window.observedAtMs)}</strong></div>
            <div class="fact">${t("fact.source")} <strong>${escapeHtml(window.source)}</strong></div>
            <div class="fact">${t("fact.provenance")} <strong>${escapeHtml(window.quality)}</strong></div>
          </div>
        </div>`;
      };
      const eventName = new Proxy({}, { get: (_target, key) => t(`event.${String(key)}`) });

      const eventDetails = (event) => {
        const d = event.details ?? {};
        const bits = [];
        if (d.usedPercentBefore != null) bits.push(`${t("detail.used")} ${d.usedPercentBefore}%→${d.usedPercentAfter}%`);
        if (d.previousResetsAtMs != null) bits.push(`${t("detail.reset")} ${exactTime(d.previousResetsAtMs)}→${exactTime(d.nextResetsAtMs)}`);
        if (d.shiftMinutes != null) bits.push(`${t("detail.shift")} ${d.shiftMinutes > 0 ? "+" : ""}${d.shiftMinutes}${t("unit.min")}`);
        if (d.balanceBefore != null) bits.push(`${t("detail.credits")} ${d.balanceBefore}→${d.balanceAfter}`);
        return bits.length ? ` · ${bits.join(" · ")}` : "";
      };
      async function refresh() {
        document.getElementById("subtitle").textContent = t("page.subtitle");
        document.getElementById("whyChanged").textContent = t("page.whyChanged");
        try {
          const response = await fetch("/api/status", { cache: "no-store" });
          const data = await response.json();
          document.getElementById("updated").textContent = new Date(data.nowMs).toLocaleTimeString() + t("updated");
          // Render from accounts, not the legacy statuses projection: statuses
          // only carries accounts that already have windows, so a configured
          // account with zero samples disappeared here while the menu bar app
          // was correctly showing why it was empty.
          const accounts = Array.isArray(data.accounts) && data.accounts.length ? data.accounts : (data.statuses ?? []);
          document.getElementById("providers").innerHTML = accounts.length
            ? accounts.map((account) => {
                const label = escapeHtml(account.accountLabel ?? account.account);
                const notice = account.collection && account.collection.health !== "recent-success"
                  ? `<p class="notice">${escapeHtml(collectionText(account.collection))}</p>`
                  : "";
                const windows = (account.windows ?? []).length
                  ? account.windows.map((window) => windowHtml(window, window.bucket === account.bottleneckBucket)).join("")
                  : `<p class="notice">${t("window.noWindows")}</p>`;
                return `<article class="provider"><h2>${escapeHtml(account.provider)} · ${label}</h2>${notice}${windows}</article>`;
              }).join("")
            : `<div class="empty">${escapeHtml(t("empty"))}</div>`;
          document.getElementById("events").innerHTML = data.events.length
            ? data.events.slice(0, 15).map((event) => `<div class="event"><span>${new Date(event.occurredAtMs).toLocaleString()}</span><span class="kind">${escapeHtml(eventName[event.kind] ?? event.kind)}</span><span>${escapeHtml(`${event.account} · ${event.summary}${eventDetails(event)}`)} · ${t("detail.confidence")} ${escapeHtml(event.confidence)}</span></div>`).join("")
            : t("noEvents");
        } catch (error) {
          document.getElementById("updated").textContent = t("failed");
        }
      }
      refresh();
      setInterval(refresh, 15000);
    </script>
  </body>
</html>
