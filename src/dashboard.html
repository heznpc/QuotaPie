<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>QuotaPie</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0b0d11;
        --card: #151820;
        --line: #282d38;
        --text: #f2f4f8;
        --muted: #8f98a8;
        --good: #54d39a;
        --warm: #f0bd5e;
        --hot: #f07474;
        --codex: #55d6be;
        --claude: #d9966b;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: radial-gradient(circle at 15% -10%, #22303a 0, transparent 34%), var(--bg);
        color: var(--text);
        font: 14px/1.45 ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      main { width: min(1100px, calc(100% - 32px)); margin: 38px auto 80px; }
      header { display: flex; justify-content: space-between; align-items: end; margin-bottom: 22px; }
      h1 { margin: 0; font-size: clamp(27px, 5vw, 44px); letter-spacing: -0.04em; }
      .subtitle, .muted { color: var(--muted); }
      .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(330px, 1fr)); gap: 16px; }
      .provider {
        background: color-mix(in srgb, var(--card) 94%, transparent);
        border: 1px solid var(--line);
        border-radius: 18px;
        padding: 20px;
        box-shadow: 0 18px 50px rgb(0 0 0 / 20%);
      }
      .provider h2 { margin: 0 0 16px; text-transform: capitalize; font-size: 20px; }
      .window { padding: 15px 0; border-top: 1px solid var(--line); }
      .window:first-of-type { border-top: 0; padding-top: 0; }
      .row { display: flex; justify-content: space-between; gap: 16px; align-items: baseline; }
      .label { font-weight: 700; }
      .remaining { font-size: 24px; font-weight: 800; letter-spacing: -0.03em; }
      .bar { height: 7px; border-radius: 99px; background: #262b34; overflow: hidden; margin: 9px 0 10px; }
      .fill { height: 100%; border-radius: inherit; background: var(--good); transition: width .35s ease; }
      .hot .fill { background: var(--hot); }
      .warm .fill { background: var(--warm); }
      .unknown .fill { background: #4c5361; }
      .facts { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 12px; color: var(--muted); font-size: 12px; }
      .fact strong { color: var(--text); font-weight: 600; }
      .badge { padding: 3px 8px; border-radius: 99px; font-size: 11px; background: #242936; color: var(--muted); }
      .bottleneck { color: var(--warm); }
      section.events { margin-top: 26px; }
      .event { display: grid; grid-template-columns: 145px 90px 1fr; gap: 12px; padding: 11px 0; border-top: 1px solid var(--line); }
      .event .kind { color: var(--warm); }
      .empty { padding: 48px 24px; text-align: center; color: var(--muted); border: 1px dashed var(--line); border-radius: 18px; }
      .notice { color: #c2410c; font-size: 13px; margin: 4px 0 10px; }
      #autoResume { margin: 24px 0; }
      .auto-account, .auto-incident { padding: 12px 0; border-top: 1px solid var(--line); }
      .auto-account label { display: flex; gap: 12px; align-items: center; cursor: pointer; }
      .auto-account input { width: 18px; height: 18px; accent-color: var(--codex); }
      .auto-incident code { display: block; overflow-wrap: anywhere; color: var(--muted); font-size: 12px; }
      .auto-incident button { margin-top: 8px; padding: 6px 10px; color: var(--text); background: var(--line); border: 1px solid var(--muted); border-radius: 6px; cursor: pointer; }
      .auto-incident button:disabled, .auto-account input:disabled { cursor: default; opacity: .5; }
      @media (max-width: 620px) {
        header { display: block; }
        .grid { grid-template-columns: 1fr; }
        .event { grid-template-columns: 1fr; gap: 2px; }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <div>
          <h1>QuotaPie</h1>
          <div class="subtitle" id="subtitle"></div>
        </div>
        <div id="updated" class="muted"></div>
      </header>
      <section id="resetSignals"></section>
      <div id="providers" class="grid"></div>
      <section id="autoResume" aria-live="polite"></section>
      <section class="events">
        <h2 id="whyChanged"></h2>
        <div id="events" class="muted"></div>
      </section>
    </main>

          "event.label.window_changed": "한도 표시 변경",
          "event.first_observation": "{label} 관측을 시작했습니다.",
          "event.out_of_order": "{label}의 오래된 응답을 무시했습니다.",
          "event.source_changed": "{label} 데이터 소스가 변경됐습니다.",
          "event.source_unknown": "{label} 원본 값이 일시적으로 사라졌습니다.",
          "event.scheduled_reset": "{label} 한도가 예정대로 갱신됐습니다.",
          "event.external_relief": "{label}에 예정 밖 충전이 감지됐습니다.",
          "event.allowance_relief": "{label} 사용률이 크게 낮아졌습니다. 리셋·한도 증액·서버 보정 중 하나일 수 있습니다.",
          "event.meter_correction": "{label} 사용률이 소폭 역행했습니다.",
          "event.schedule_rebased": "{label} 리셋 시각이 재조정됐습니다.",
          "event.paid_usage": "{provider} 크레딧 조회값: {balanceBefore} → {balanceAfter}. 실제 사용·결제 잔액 변동은 미확인입니다.",
          "event.credit_topup": "{provider} 크레딧 증가: {balanceBefore} → {balanceAfter} (+{balanceAdded}).",
          "event.banked_reset_added": "리셋권 추가: {countBefore}개 → {countAfter}개 (+{countAdded}개).",
          "event.banked_reset_consumed": "리셋권 {countBefore}개 → {countAfter}개 ({countUsed}개 감소).{quotaRecoveryText}",
          "event.bucket_retired": "{label} 항목이 공급자 전체 응답에서 사라져 추적을 종료했습니다.",
          "event.window_changed": "한도 표시 변경: {fromLabel} → {toLabel} · 계정·플랜 변경 여부 미확인",
          "event.account_changed": "다른 Codex 계정으로 로그인한 것을 확인했습니다. 새 계정의 잔량을 별도로 추적합니다.",
          "event.plan_changed": "같은 Codex 계정의 플랜 변경: {fromPlan} → {toPlan} · 잔량을 새로 측정합니다.",
          "event.label.account_changed": "Codex 로그인 계정 변경",
          "event.label.plan_changed": "Codex 플랜 변경",
        },
      };
      const template = (key) => STRING_TABLE[LOCALE]?.[key] ?? STRING_TABLE[DEFAULT_LOCALE]?.[key];
      const t = (key, params = {}) => {
        const value = template(key);
        if (value == null) return key;
        return value.replace(/\{([a-zA-Z0-9]+)\}/g, (_match, name) => String(params[name] ?? ""));
      };
      const enumText = (namespace, value) => {
        if (value == null) return t("time.unknown");
        return template(`${namespace}.${value}`) ?? String(value);
      };

      const escapeHtml = (value) => String(value ?? "")
        .replaceAll("&", "&amp;").replaceAll("<", "&lt;").replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;").replaceAll("'", "&#039;");
      const duration = (ms) => {
        if (ms == null) return t("time.unknown");
        const minutes = Math.max(0, Math.round(ms / 60000));
        const days = Math.floor(minutes / 1440);
        const hours = Math.floor((minutes % 1440) / 60);
        const rest = minutes % 60;
        return days ? `${days}${t("time.days")} ${hours}${t("time.hours")}` : hours ? `${hours}${t("time.hours")} ${rest}${t("time.minutes")}` : `${rest}${t("time.minutes")}`;
      };
      const number = (value, suffix = "") => value == null ? "—" : `${Number(value).toFixed(1)}${suffix}`;
      const exactTime = (ms) => ms == null ? "—" : new Date(ms).toLocaleString(DATE_LOCALE, { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" });

      const collectionText = (collection) =>
        enumText("collection", collection.errorCategory ?? collection.health);

      const windowHtml = (window, bottleneck) => {
        const remaining = window.remainingPercent;
        // All quota bars show remaining capacity and shrink as it is consumed.
        const used = window.usedPercent ?? (remaining == null ? null : 100 - remaining);
        const heat = window.freshness !== "fresh" || remaining == null
          ? "unknown"
          : remaining <= window.reservePercent ? "hot" : window.showUsageSpeed === true && window.paceRatio > 1 ? "warm" : "";
        return `<div class="window ${heat}">
          <div class="row"><span class="label ${bottleneck ? "bottleneck" : ""}">${bottleneck ? "● " : ""}${escapeHtml(window.label)}</span><span class="badge">${escapeHtml(enumText("freshness", window.freshness))}</span></div>
          <div class="row"><span class="remaining">${remaining == null ? "—" : `${remaining.toFixed(1)}${t("window.remaining")}`}</span><span class="muted">${used == null ? "" : `${used.toFixed(1)}${t("window.used")}`}</span><span class="muted">${window.resetsAtMs == null ? t("window.resetUnknown") : `${duration(window.timeToResetMs)}${t("window.resetsIn")}`}</span></div>
          <div class="bar"><div class="fill" style="width:${remaining == null ? 0 : Math.max(0, Math.min(100, remaining))}%"></div></div>
          <div class="facts">
            ${window.showUsageSpeed === true ? `<div class="fact">${t("fact.recent")} <strong>${number(window.recentBurnPerHour, t("unit.perActiveHour"))}</strong></div>
            <div class="fact">${t("fact.personal")} <strong>${number(window.personalBurnPerHour, t("unit.perActiveHour"))}</strong></div>
            <div class="fact">${t("fact.vsSafe")} <strong>${number(window.paceRatio, t("unit.times"))}</strong></div>
            <div class="fact">${t("fact.confidence")} <strong>${escapeHtml(enumText("confidence", window.confidence))}</strong></div>
            <div class="fact">${t("fact.activeHours")} <strong>${number(window.activeHoursUntilReset, t("unit.hours"))}</strong></div>
            <div class="fact">${t("fact.samples")} <strong>${window.sampleCount}</strong></div>
            <div class="fact">${t("fact.safetyEta")} <strong>${exactTime(window.reserveReachesAtMs)}</strong></div>` : ""}
            <div class="fact">${t("fact.providerReset")} <strong>${exactTime(window.resetsAtMs)}</strong></div>
            <div class="fact">${t("fact.observed")} <strong>${exactTime(window.observedAtMs)}</strong></div>
            <div class="fact">${t("fact.observedAge")} <strong>${duration(Date.now() - window.observedAtMs)}</strong></div>
            <div class="fact">${t("fact.source")} <strong>${escapeHtml(enumText("source", window.source))}</strong></div>
            <div class="fact">${t("fact.provenance")} <strong>${escapeHtml(enumText("quality", window.quality))}</strong></div>
          </div>
        </div>`;
      };

      // Stored displayText is only a compatibility fallback: it was rendered in
      // the daemon's locale at write time. Known events are rebuilt here from
      // their semantic kind and parameters in the viewer's current language.
      const EVENT_MESSAGE_PARAMS = Object.freeze({
        first_observation: ["label"],
        out_of_order: ["label"],
        source_changed: ["label"],
        source_unknown: ["label"],
        scheduled_reset: ["label"],
        external_relief: ["label"],
        allowance_relief: ["label"],
        meter_correction: ["label"],
        schedule_rebased: ["label"],
        paid_usage: ["provider"],
        credit_topup: ["provider"],
        banked_reset_consumed: [],
        bucket_retired: ["label"],
        window_changed: ["fromLabel", "toLabel"],
        account_changed: [],
        plan_changed: ["fromPlan", "toPlan"],
      });
      const eventMessage = (event) => {
        if (event.details?.resetTicketRecovery === true) return LOCALE === "ko"

      async function changeAutoResume(body) {
