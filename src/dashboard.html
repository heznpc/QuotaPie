<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>QuotaPie</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0b0d11;
        --card: #151820;
        --line: #282d38;
        --text: #f2f4f8;
        --muted: #8f98a8;
        --good: #54d39a;
        --warm: #f0bd5e;
        --hot: #f07474;
        --codex: #55d6be;
        --claude: #d9966b;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: radial-gradient(circle at 15% -10%, #22303a 0, transparent 34%), var(--bg);
        color: var(--text);
        font: 14px/1.45 ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      main { width: min(1100px, calc(100% - 32px)); margin: 38px auto 80px; }
      header { display: flex; justify-content: space-between; align-items: end; margin-bottom: 22px; }
      h1 { margin: 0; font-size: clamp(27px, 5vw, 44px); letter-spacing: -0.04em; }
      .subtitle, .muted { color: var(--muted); }
      .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(330px, 1fr)); gap: 16px; }
      .provider {
        background: color-mix(in srgb, var(--card) 94%, transparent);
        border: 1px solid var(--line);
        border-radius: 18px;
        padding: 20px;
        box-shadow: 0 18px 50px rgb(0 0 0 / 20%);
      }
      .provider h2 { margin: 0 0 16px; text-transform: capitalize; font-size: 20px; }
      .window { padding: 15px 0; border-top: 1px solid var(--line); }
      .window:first-of-type { border-top: 0; padding-top: 0; }
      .row { display: flex; justify-content: space-between; gap: 16px; align-items: baseline; }
      .label { font-weight: 700; }
      .remaining { font-size: 24px; font-weight: 800; letter-spacing: -0.03em; }
      .bar { height: 7px; border-radius: 99px; background: #262b34; overflow: hidden; margin: 9px 0 10px; }
      .fill { height: 100%; border-radius: inherit; background: var(--good); transition: width .35s ease; }
      .hot .fill { background: var(--hot); }
      .warm .fill { background: var(--warm); }
      .unknown .fill { background: #4c5361; }
      .facts { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 12px; color: var(--muted); font-size: 12px; }
      .fact strong { color: var(--text); font-weight: 600; }
      .badge { padding: 3px 8px; border-radius: 99px; font-size: 11px; background: #242936; color: var(--muted); }
      .bottleneck { color: var(--warm); }
      section.events { margin-top: 26px; }
      .event { display: grid; grid-template-columns: 145px 90px 1fr; gap: 12px; padding: 11px 0; border-top: 1px solid var(--line); }
      .event .kind { color: var(--warm); }
      .empty { padding: 48px 24px; text-align: center; color: var(--muted); border: 1px dashed var(--line); border-radius: 18px; }
      .notice { color: #c2410c; font-size: 13px; margin: 4px 0 10px; }
      @media (max-width: 620px) {
        header { display: block; }
        .grid { grid-template-columns: 1fr; }
        .event { grid-template-columns: 1fr; gap: 2px; }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <div>
          <h1>QuotaPie</h1>
          <div class="subtitle" id="subtitle"></div>
        </div>
        <div id="updated" class="muted"></div>
      </header>
      <section id="resetSignals"></section>
      <div id="providers" class="grid"></div>
      <section id="resetTracking" class="events"></section>
      <section class="events">
        <h2 id="whyChanged"></h2>
        <div id="events" class="muted"></div>
      </section>
    </main>

          "event.allowance_relief": "{label} 사용률이 크게 낮아졌습니다. 리셋·한도 증액·서버 보정 중 하나일 수 있습니다.",

          "event.paid_usage": "{provider} 유료 크레딧이 사용됐습니다.",
          "event.credit_topup": "{provider} 크레딧 잔액이 증가했습니다.",
          "event.banked_reset_consumed": "저장형 리셋이 사용된 것으로 보입니다.",
          "event.bucket_retired": "{label} 항목이 공급자 전체 응답에서 사라져 추적을 종료했습니다.",
          "event.window_changed": "{limitId} {lane} 한도 창 전환: {fromLabel} → {toLabel}",
        },
      };
      const template = (key) => STRING_TABLE[LOCALE]?.[key] ?? STRING_TABLE[DEFAULT_LOCALE]?.[key];
      const t = (key, params = {}) => {
        const value = template(key);
        if (value == null) return key;
        return value.replace(/\{([a-zA-Z0-9]+)\}/g, (_match, name) => String(params[name] ?? ""));
      };
      const enumText = (namespace, value) => {
        if (value == null) return t("time.unknown");
        return template(`${namespace}.${value}`) ?? String(value);
      };

      const escapeHtml = (value) => String(value ?? "")
        .replaceAll("&", "&amp;").replaceAll("<", "&lt;").replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;").replaceAll("'", "&#039;");
      const duration = (ms) => {
        if (ms == null) return t("time.unknown");
        const minutes = Math.max(0, Math.round(ms / 60000));
        const days = Math.floor(minutes / 1440);
        const hours = Math.floor((minutes % 1440) / 60);
        const rest = minutes % 60;
        return days ? `${days}${t("time.days")} ${hours}${t("time.hours")}` : hours ? `${hours}${t("time.hours")} ${rest}${t("time.minutes")}` : `${rest}${t("time.minutes")}`;
      };
      const number = (value, suffix = "") => value == null ? "—" : `${Number(value).toFixed(1)}${suffix}`;
      const exactTime = (ms) => ms == null ? "—" : new Date(ms).toLocaleString(DATE_LOCALE, { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" });

      const collectionText = (collection) =>
        enumText("collection", collection.errorCategory ?? collection.health);

      const windowHtml = (window, bottleneck) => {
        const remaining = window.remainingPercent;
        // The fill is the used percentage, exactly as the native app draws it.
        // The two surfaces drawing opposite bars for the same window was a
        // plain lie about which one was nearly full.
        const used = window.usedPercent ?? (remaining == null ? null : 100 - remaining);
        const heat = window.freshness !== "fresh" || remaining == null
          ? "unknown"
          : remaining <= window.reservePercent ? "hot" : window.paceRatio > 1 ? "warm" : "";
        return `<div class="window ${heat}">
          <div class="row"><span class="label ${bottleneck ? "bottleneck" : ""}">${bottleneck ? "● " : ""}${escapeHtml(window.label)}</span><span class="badge">${escapeHtml(enumText("freshness", window.freshness))}</span></div>
          <div class="row"><span class="remaining">${used == null ? "—" : `${used.toFixed(1)}${t("window.used")}`}</span><span class="muted">${remaining == null ? "" : `${remaining.toFixed(1)}${t("window.remaining")}`}</span><span class="muted">${window.resetsAtMs == null ? t("window.resetUnknown") : `${duration(window.timeToResetMs)}${t("window.resetsIn")}`}</span></div>
          <div class="bar"><div class="fill" style="width:${used == null ? 0 : Math.max(0, Math.min(100, used))}%"></div></div>
          <div class="facts">
            <div class="fact">${t("fact.recent")} <strong>${number(window.recentBurnPerHour, t("unit.perActiveHour"))}</strong></div>
            <div class="fact">${t("fact.personal")} <strong>${number(window.personalBurnPerHour, t("unit.perActiveHour"))}</strong></div>
            <div class="fact">${t("fact.vsSafe")} <strong>${number(window.paceRatio, t("unit.times"))}</strong></div>
            <div class="fact">${t("fact.confidence")} <strong>${escapeHtml(enumText("confidence", window.confidence))}</strong></div>
            <div class="fact">${t("fact.activeHours")} <strong>${number(window.activeHoursUntilReset, t("unit.hours"))}</strong></div>
            <div class="fact">${t("fact.samples")} <strong>${window.sampleCount}</strong></div>
            <div class="fact">${t("fact.providerReset")} <strong>${exactTime(window.resetsAtMs)}</strong></div>
            <div class="fact">${t("fact.safetyEta")} <strong>${exactTime(window.exhaustsAtMs)}</strong></div>
            <div class="fact">${t("fact.observed")} <strong>${exactTime(window.observedAtMs)}</strong></div>
            <div class="fact">${t("fact.observedAge")} <strong>${duration(Date.now() - window.observedAtMs)}</strong></div>
            <div class="fact">${t("fact.source")} <strong>${escapeHtml(enumText("source", window.source))}</strong></div>
            <div class="fact">${t("fact.provenance")} <strong>${escapeHtml(enumText("quality", window.quality))}</strong></div>
          </div>
        </div>`;
      };

      // Stored displayText is only a compatibility fallback: it was rendered in
      // the daemon's locale at write time. Known events are rebuilt here from
      // their semantic kind and parameters in the viewer's current language.
      const EVENT_MESSAGE_PARAMS = Object.freeze({
        first_observation: ["label"],
        out_of_order: ["label"],
        source_changed: ["label"],
        source_unknown: ["label"],
        scheduled_reset: ["label"],
        external_relief: ["label"],
        allowance_relief: ["label"],
        meter_correction: ["label"],
        schedule_rebased: ["label"],
        paid_usage: ["provider"],
        credit_topup: ["provider"],
        banked_reset_consumed: [],
        bucket_retired: ["label"],
        window_changed: ["limitId", "lane", "fromLabel", "toLabel"],
      });
      const eventMessage = (event) => {
        const required = EVENT_MESSAGE_PARAMS[event.kind];
        if (required == null) return event.displayText ?? event.kind;
        const params = { provider: event.provider, account: event.account, ...(event.details ?? {}) };
        if (required.some((name) => params[name] == null)) return event.displayText ?? event.kind;
        return t(`event.${event.kind}`, params);
      };

      const eventDetails = (event) => {
        const d = event.details ?? {};
        const bits = [];
        if (d.usedPercentBefore != null && d.usedPercentAfter != null) bits.push(`${t("detail.used")} ${d.usedPercentBefore}%→${d.usedPercentAfter}%`);
        if (d.previousResetsAtMs != null && d.nextResetsAtMs != null) bits.push(`${t("detail.reset")} ${exactTime(d.previousResetsAtMs)}→${exactTime(d.nextResetsAtMs)}`);
        if (d.shiftMinutes != null) bits.push(`${t("detail.shift")} ${d.shiftMinutes > 0 ? "+" : ""}${d.shiftMinutes}${t("unit.min")}`);
        if (d.balanceBefore != null && d.balanceAfter != null) bits.push(`${t("detail.credits")} ${d.balanceBefore}→${d.balanceAfter}`);
        return bits.length ? ` · ${bits.join(" · ")}` : "";
      };
      async function refresh() {
        document.getElementById("subtitle").textContent = t("page.subtitle");
        document.getElementById("whyChanged").textContent = t("page.whyChanged");
        try {
          const response = await fetch("/api/status", { cache: "no-store" });
          const data = await response.json();
          document.getElementById("updated").textContent = new Date(data.nowMs).toLocaleTimeString(DATE_LOCALE) + t("updated");
          // Render from accounts, not the legacy statuses projection: statuses
          // only carries accounts that already have windows, so a configured
          // account with zero samples disappeared here while the menu bar app
          // was correctly showing why it was empty.
          const feed = data.resetSignals;
          const words = LOCALE === "ko"
            ? { title: "Codex 리셋 소식", relay: "Reset Beacon 경유 · 일부 소식만 수집, X 원문 미검증", direct: "X 직접 수집 · 다섯 계정", source: "원문 보기", empty: "아직 수집된 소식이 없습니다", possible: "가능성", announced: "예고", reported: "시행 소식", updated: "변경", withdrawn: "철회", ready: "수집 정상", waiting: "첫 수집 대기", error: "수집 실패 · 저장된 소식", stale: "수집 지연 · 저장된 소식", note: "공개 소식과 내 계정 한도는 별개입니다." }
            : { title: "Codex reset signals", relay: "Via Reset Beacon · partial coverage, X originals not verified", direct: "X direct · five accounts", source: "Original post", empty: "No signals collected", possible: "Possible", announced: "Announced", reported: "Reported", updated: "Updated", withdrawn: "Withdrawn", ready: "Collection healthy", waiting: "Waiting", error: "Collection failed · saved signals", stale: "Stale · saved signals", note: "Public signals are separate from your account quota." };
          document.getElementById("resetSignals").innerHTML = feed?.enabled ? `<article class="provider"><h2>${words.title}</h2><p class="notice">${feed.source === "x-api" ? words.direct : words.relay} · ${escapeHtml(words[feed.state] ?? feed.state)}</p>${(feed.signals ?? []).slice(0,5).map(signal => {
            const safe = /^https:\/\/x\.com\/(thsottiaux|reach_vb|dkundel|OpenAIDevs|OpenAI)\/status\/\d+$/.test(signal.sourceUrl);
            return `<div class="event"><strong>${escapeHtml(words[signal.state] ?? signal.state)}</strong><span>@${escapeHtml(signal.author)} · ${t("tracking.publication")} ${escapeHtml(exactTime(signal.publishedAtMs))}</span><span>${escapeHtml(signal.text)} ${safe ? `<a href="${escapeHtml(signal.sourceUrl)}" target="_blank" rel="noopener noreferrer">${words.source}</a>` : ""}</span></div>`;
          }).join("") || words.empty}<p class="notice">${words.note}</p></article>` : "";
          const accounts = Array.isArray(data.accounts) && data.accounts.length ? data.accounts : (data.statuses ?? []);
          const recoveries = data.resetTracking?.recoveries ?? [];
          document.getElementById("resetTracking").innerHTML = `<h2>${t("tracking.title")}</h2><p class="notice">${t("tracking.note")}</p>${recoveries.slice(0, 10).map(recovery => {
            const account = accounts.find(a => a.provider === recovery.provider && a.account === recovery.account);
            const percent = value => value == null ? t("time.unknown") : `${Number(value).toFixed(1)}%`;
            return `<article class="provider"><h3>${escapeHtml(recovery.provider)} · ${escapeHtml(account?.accountLabel ?? recovery.account)} · ${escapeHtml(recovery.bucket)}</h3>
              <p>${t("tracking.interval")}: ${escapeHtml(exactTime(recovery.observedBetween.afterMs))} → ${escapeHtml(exactTime(recovery.observedBetween.byMs))}</p>
              <p>${t("tracking.remaining")}: ${percent(recovery.remainingBefore)} → ${percent(recovery.remainingAfter)}</p>
              <p>${t("tracking.schedule")}: ${escapeHtml(exactTime(recovery.previousResetsAtMs))} → ${escapeHtml(exactTime(recovery.nextResetsAtMs))}</p>
              <p class="notice">${escapeHtml(t(`tracking.${recovery.reason}`))}</p>
              ${(recovery.candidates ?? []).map(candidate => {
                const safe = /^https:\/\/x\.com\/(thsottiaux|reach_vb|dkundel|OpenAIDevs|OpenAI)\/status\/\d+$/.test(candidate.sourceUrl);
                return `<p>${safe ? `<a href="${escapeHtml(candidate.sourceUrl)}" target="_blank" rel="noopener noreferrer">${t("tracking.candidate")}</a>` : t("tracking.candidate")} · ${t("tracking.publication")} ${escapeHtml(exactTime(candidate.publishedAtMs))}<br><span class="notice">${t(candidate.observedVia === "public-feed" ? "tracking.relay" : "tracking.direct")}${candidate.publicationAfterObservation ? ` · ${t("tracking.later")}` : ""}</span></p>`;
              }).join("")}</article>`;
          }).join("") || `<p class="muted">${t("tracking.empty")}</p>`}`;
          document.getElementById("providers").innerHTML = accounts.length
            ? accounts.map((account) => {
                const label = escapeHtml(account.accountLabel ?? account.account);
                const notice = account.collection && account.collection.health !== "recent-success"
                  ? `<p class="notice">${escapeHtml(collectionText(account.collection))}</p>`
                  : "";
                const windows = (account.windows ?? []).length
                  ? account.windows.map((window) => windowHtml(window, window.bucket === account.bottleneckBucket)).join("")
                  : `<p class="notice">${t("window.noWindows")}</p>`;
                return `<article class="provider"><h2>${escapeHtml(account.provider)} · ${label}</h2>${notice}${windows}</article>`;
              }).join("")
            : `<div class="empty">${escapeHtml(t("empty"))}</div>`;
          const events = data.events ?? [];
          document.getElementById("events").innerHTML = events.length
            ? events.slice(0, 15).map((event) => `<div class="event"><span>${new Date(event.occurredAtMs).toLocaleString(DATE_LOCALE)}</span><span class="kind">${escapeHtml(enumText("event.label", event.kind))}</span><span>${escapeHtml(`${event.account} · ${eventMessage(event)}${eventDetails(event)}`)} · ${t("detail.confidence")} ${escapeHtml(enumText("confidence", event.confidence))}</span></div>`).join("")
            : t("noEvents");
        } catch (error) {
          document.getElementById("updated").textContent = t("failed");
        }
      }
      document.getElementById("updated").textContent = t("page.connecting");
      refresh();
      setInterval(refresh, 15000);
    </script>
  </body>
</html>
