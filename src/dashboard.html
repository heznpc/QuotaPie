<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TimeQuota</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0b0d11;
        --card: #151820;
        --line: #282d38;
        --text: #f2f4f8;
        --muted: #8f98a8;
        --good: #54d39a;
        --warm: #f0bd5e;
        --hot: #f07474;
        --codex: #55d6be;
        --claude: #d9966b;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: radial-gradient(circle at 15% -10%, #22303a 0, transparent 34%), var(--bg);
        color: var(--text);
        font: 14px/1.45 ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      main { width: min(1100px, calc(100% - 32px)); margin: 38px auto 80px; }
      header { display: flex; justify-content: space-between; align-items: end; margin-bottom: 22px; }
      h1 { margin: 0; font-size: clamp(27px, 5vw, 44px); letter-spacing: -0.04em; }
      .subtitle, .muted { color: var(--muted); }
      .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(330px, 1fr)); gap: 16px; }
      .provider {
        background: color-mix(in srgb, var(--card) 94%, transparent);
        border: 1px solid var(--line);
        border-radius: 18px;
        padding: 20px;
        box-shadow: 0 18px 50px rgb(0 0 0 / 20%);
      }
      .provider h2 { margin: 0 0 16px; text-transform: capitalize; font-size: 20px; }
      .window { padding: 15px 0; border-top: 1px solid var(--line); }
      .window:first-of-type { border-top: 0; padding-top: 0; }
      .row { display: flex; justify-content: space-between; gap: 16px; align-items: baseline; }
      .label { font-weight: 700; }
      .remaining { font-size: 24px; font-weight: 800; letter-spacing: -0.03em; }
      .bar { height: 7px; border-radius: 99px; background: #262b34; overflow: hidden; margin: 9px 0 10px; }
      .fill { height: 100%; border-radius: inherit; background: var(--good); transition: width .35s ease; }
      .hot .fill { background: var(--hot); }
      .warm .fill { background: var(--warm); }
      .unknown .fill { background: #4c5361; }
      .facts { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 12px; color: var(--muted); font-size: 12px; }
      .fact strong { color: var(--text); font-weight: 600; }
      .badge { padding: 3px 8px; border-radius: 99px; font-size: 11px; background: #242936; color: var(--muted); }
      .bottleneck { color: var(--warm); }
      section.events { margin-top: 26px; }
      .event { display: grid; grid-template-columns: 145px 90px 1fr; gap: 12px; padding: 11px 0; border-top: 1px solid var(--line); }
      .event .kind { color: var(--warm); }
      .empty { padding: 48px 24px; text-align: center; color: var(--muted); border: 1px dashed var(--line); border-radius: 18px; }
      @media (max-width: 620px) {
        header { display: block; }
        .grid { grid-template-columns: 1fr; }
        .event { grid-template-columns: 1fr; gap: 2px; }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <div>
          <h1>TimeQuota</h1>
          <div class="subtitle">공급자 원본 시계 + 개인 사용 속도</div>
        </div>
        <div id="updated" class="muted">연결 중…</div>
      </header>
      <div id="providers" class="grid"><div class="empty">첫 관측을 기다리는 중입니다.</div></div>
      <section class="events">
        <h2>왜 바뀌었나</h2>
        <div id="events" class="muted">아직 기록된 이벤트가 없습니다.</div>
      </section>
    </main>
    <script>
      const escapeHtml = (value) => String(value ?? "")
        .replaceAll("&", "&amp;").replaceAll("<", "&lt;").replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;").replaceAll("'", "&#039;");
      const duration = (ms) => {
        if (ms == null) return "알 수 없음";
        const minutes = Math.max(0, Math.round(ms / 60000));
        const days = Math.floor(minutes / 1440);
        const hours = Math.floor((minutes % 1440) / 60);
        const rest = minutes % 60;
        return days ? `${days}일 ${hours}시간` : hours ? `${hours}시간 ${rest}분` : `${rest}분`;
      };
      const number = (value, suffix = "") => value == null ? "—" : `${Number(value).toFixed(1)}${suffix}`;
      const exactTime = (ms) => ms == null ? "—" : new Date(ms).toLocaleString([], { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" });
      const statusName = { fresh: "정상", stale: "오래됨", reset_due: "갱신 확인 중", unknown: "알 수 없음" };
      const windowHtml = (window, bottleneck) => {
        const remaining = window.remainingPercent;
        const heat = window.freshness !== "fresh" || remaining == null
          ? "unknown"
          : remaining <= window.reservePercent ? "hot" : window.paceRatio > 1 ? "warm" : "";
        return `<div class="window ${heat}">
          <div class="row"><span class="label ${bottleneck ? "bottleneck" : ""}">${bottleneck ? "● " : ""}${escapeHtml(window.label)}</span><span class="badge">${escapeHtml(statusName[window.freshness] ?? window.freshness)}</span></div>
          <div class="row"><span class="remaining">${remaining == null ? "—" : `${remaining.toFixed(1)}%`}</span><span class="muted">${window.resetsAtMs == null ? "리셋 시각 미확인" : `${duration(window.timeToResetMs)} 뒤 리셋`}</span></div>
          <div class="bar"><div class="fill" style="width:${remaining == null ? 0 : Math.max(0, Math.min(100, remaining))}%"></div></div>
          <div class="facts">
            <div class="fact">현재 속도 <strong>${number(window.recentBurnPerHour, "%/활동h")}</strong></div>
            <div class="fact">개인 기준 <strong>${number(window.personalBurnPerHour, "%/활동h")}</strong></div>
            <div class="fact">안전 속도 대비 <strong>${number(window.paceRatio, "×")}</strong></div>
            <div class="fact">예측 신뢰도 <strong>${escapeHtml(window.confidence)}</strong></div>
            <div class="fact">활동 가능 시간 <strong>${number(window.activeHoursUntilReset, "h")}</strong></div>
            <div class="fact">학습 표본 <strong>${window.sampleCount}</strong></div>
            <div class="fact">공급자 리셋 <strong>${exactTime(window.resetsAtMs)}</strong></div>
            <div class="fact">안전 여유 ETA <strong>${exactTime(window.exhaustsAtMs)}</strong></div>
            <div class="fact">원본 관측 <strong>${exactTime(window.observedAtMs)}</strong></div>
            <div class="fact">관측 경과 <strong>${duration(Date.now() - window.observedAtMs)} 전</strong></div>
            <div class="fact">데이터 출처 <strong>${escapeHtml(window.source)}</strong></div>
            <div class="fact">원본성 <strong>${escapeHtml(window.quality)}</strong></div>
          </div>
        </div>`;
      };
      const eventName = {
        first_observation: "첫 관측",
        scheduled_reset: "정상 리셋",
        external_relief: "예정 밖 충전",
        allowance_relief: "한도 완화 가능성",
        schedule_rebased: "리셋 시각 조정",
        meter_correction: "사용률 보정",
        source_unknown: "원본 누락",
        source_changed: "데이터 소스 변경",
        paid_usage: "유료 크레딧 사용",
        credit_topup: "크레딧 증가",
        banked_reset_consumed: "저장형 리셋 사용",
        bucket_retired: "항목 추적 종료",
        out_of_order: "오래된 응답 무시"
      };
      const eventDetails = (event) => {
        const d = event.details ?? {};
        const bits = [];
        if (d.usedPercentBefore != null) bits.push(`사용 ${d.usedPercentBefore}%→${d.usedPercentAfter}%`);
        if (d.previousResetsAtMs != null) bits.push(`리셋 ${exactTime(d.previousResetsAtMs)}→${exactTime(d.nextResetsAtMs)}`);
        if (d.shiftMinutes != null) bits.push(`시각 ${d.shiftMinutes > 0 ? "+" : ""}${d.shiftMinutes}분`);
        if (d.balanceBefore != null) bits.push(`크레딧 ${d.balanceBefore}→${d.balanceAfter}`);
        return bits.length ? ` · ${bits.join(" · ")}` : "";
      };
      async function refresh() {
        try {
          const response = await fetch("/api/status", { cache: "no-store" });
          const data = await response.json();
          document.getElementById("updated").textContent = new Date(data.nowMs).toLocaleTimeString() + " 화면 갱신";
          document.getElementById("providers").innerHTML = data.statuses.length
            ? data.statuses.map((status) => `<article class="provider"><h2>${escapeHtml(status.provider)} · ${escapeHtml(status.accountLabel ?? status.account)}</h2>${status.windows.map((window) => windowHtml(window, window.bucket === status.bottleneckBucket)).join("")}</article>`).join("")
            : '<div class="empty">`timequota poll` 실행 후 Claude status-line을 연결해 주세요.</div>';
          document.getElementById("events").innerHTML = data.events.length
            ? data.events.slice(0, 15).map((event) => `<div class="event"><span>${new Date(event.occurredAtMs).toLocaleString()}</span><span class="kind">${escapeHtml(eventName[event.kind] ?? event.kind)}</span><span>${escapeHtml(`${event.account} · ${event.summary}${eventDetails(event)}`)} · 신뢰도 ${escapeHtml(event.confidence)}</span></div>`).join("")
            : "아직 기록된 이벤트가 없습니다.";
        } catch (error) {
          document.getElementById("updated").textContent = "연결 실패";
        }
      }
      refresh();
      setInterval(refresh, 15000);
    </script>
  </body>
</html>
